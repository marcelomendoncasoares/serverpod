class: TableMigration
fields:
  name: String
  dartName: String?
  module: String?
  schema: String

  addColumns: List<ColumnDefinition>
  deleteColumns: List<String>
  modifyColumns: List<ColumnMigration>

  addIndexes: List<IndexDefinition>
  deleteIndexes: List<String>

  addForeignKeys: List<ForeignKeyDefinition>
  deleteForeignKeys: List<String>

  ### Nullable so that migration files created before row-level security was
  ### introduced deserialize without error (treated as an empty list).
  addRowSecurityPolicies: List<RowSecurityPolicyDefinition>?
  deleteRowSecurityPolicies: List<String>?

  warnings: List<DatabaseMigrationWarning>

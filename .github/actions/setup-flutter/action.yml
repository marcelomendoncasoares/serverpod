name: Set up Flutter with retry
description: Retries subosito/flutter-action for transient setup failures.

inputs:
  flutter-version:
    description: Flutter SDK version to install.
    required: true
  channel:
    description: Flutter SDK channel.
    required: false
    default: stable
  cache:
    description: Whether to cache the Flutter SDK.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Flutter attempt 1
      id: flutter_1
      continue-on-error: true
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.channel }}
        cache: ${{ inputs.cache }}

    - name: Wait before Flutter retry 2
      if: steps.flutter_1.outcome == 'failure'
      shell: bash
      run: sleep 60

    - name: Set up Flutter attempt 2
      id: flutter_2
      if: steps.flutter_1.outcome == 'failure'
      continue-on-error: true
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.channel }}
        cache: ${{ inputs.cache }}

    - name: Wait before Flutter retry 3
      if: steps.flutter_2.outcome == 'failure'
      shell: bash
      run: sleep 120

    - name: Set up Flutter attempt 3
      if: steps.flutter_2.outcome == 'failure'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.channel }}
        cache: ${{ inputs.cache }}
